[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-council"
version = "1.0.0"
description = "Multi-model AI debate tool — pose a question, let top AI models argue, get a synthesized verdict"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.50",
    # >=2.0,<3.0 — NOT a pin to what this machine happened to hold (it held 1.73.1). The old
    # `>=1.55.0` spanned a BREAKING change in the Interactions API: 2.x types create() as
    # `Interaction | AsyncStream[...]` and `Interaction.id` as Optional[str], so src/ cannot
    # type-check against both shapes at once and the range could not reproduce a green gate.
    # src/ is written against 2.x; the floor now says so. Upper bound by semver, so the next
    # major cannot silently re-open the same class. (BACKLOG #124)
    "google-genai>=2.0,<3.0",
    "python-frontmatter>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",         # fleet floor == [tool.pytest] minversion (ARC-4 D2)
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8",   # dep-parity: installed 3.8.0 was undeclared (checker rule 10; 2026-07-23 session-close) — declaring, not adding
    "ruff>=0.15.5",        # fleet floor == [tool.ruff] required-version (ARC-4 leg 1)
    "mypy>=1.10",
    "types-PyYAML>=6.0",   # PyYAML ships no py.typed -> import-untyped (NOT covered by ignore_missing_imports); stub package keeps `mypy src/` clean without a per-line ignore
    "pre-commit>=4.5",  # in-venv so the SessionStart `python -m pre_commit install` hook resolves under an active .venv (G8); matches hub [dev] floor
]

[project.scripts]
ai-council = "ai_council.cli:main"
council = "ai_council.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ai_council*", "config*"]

[tool.pytest.ini_options]
# === UNIVERSAL (fleet methodology — ARC 4 leg 1, 2026-07-18; RULING-S split) ===
minversion = "9.0"   # declared fleet pytest floor (ARC 4 D2)
# === REPO-PERSONAL (this repo's pytest config — may differ) ====================
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require real API keys)",
    "envcheck: marks tests that verify environment setup (API keys present)",
]

[tool.coverage.run]
source = ["src/ai_council"]
omit = ["src/ai_council/research/providers/openai_deep_research.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
strict = false

[tool.ruff]
# === UNIVERSAL (fleet methodology — ARC 4 leg 1, 2026-07-18) ==================
# Equalized fleet ruff SHAPE (RULING-S split; RULING-PY target). Do not diverge
# without a `.methodology.yaml` declaration. Canonical: hub templates/ruff-config-block.toml.
required-version = ">=0.15.5"   # floor == pinned pre-commit ruff rev (v0.15.5)
target-version = "py311"        # RULING-PY baseline (was py312); "always newest Python" lift = #351
line-length = 120               # agreed fleet line-length (ARC 4 D1)

# === REPO-PERSONAL (this repo's lint posture — declared divergence) ===========
[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
