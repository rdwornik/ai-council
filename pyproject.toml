[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-council"
version = "1.0.0"
description = "Multi-model AI debate tool — pose a question, let top AI models argue, get a synthesized verdict"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.55.0",
    "python-frontmatter>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "pre-commit>=4.5",  # in-venv so the SessionStart `python -m pre_commit install` hook resolves under an active .venv (G8); matches hub [dev] floor
]

[project.scripts]
ai-council = "ai_council.cli:main"
council = "ai_council.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ai_council*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require real API keys)",
    "envcheck: marks tests that verify environment setup (API keys present)",
]

[tool.coverage.run]
source = ["src/ai_council"]
omit = ["src/ai_council/research/providers/openai_deep_research.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
strict = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
