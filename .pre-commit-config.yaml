default_install_hook_types:
- pre-commit
- commit-msg
- pre-push
default_stages:
- pre-commit
repos:
- repo: local
  hooks:
  - id: normalize-headers
    name: Normalize dated-log entry headers
    language: python
    entry: python scripts/normalize_headers.py
    files: ^(LESSONS|JOURNAL)\.md$
    pass_filenames: true
  - id: floor-hash-verify
    name: Verify CLAUDE-FLOOR.md matches its sha256 sidecar
    entry: python .claude/check_floor_hash.py
    language: system
    files: ^\.claude/CLAUDE-FLOOR\.md(\.sha256)?$
    pass_filenames: false
  - id: canonical_freshness
    name: canonical_freshness last_reviewed gate (A2 FAIL blocks the commit)
    entry: python scripts/canonical_freshness_gate.py
    language: system
    always_run: true
    pass_filenames: false
  - id: validate-audit-casing
    name: ADR-101 R4 audit-filename casing gate (fleet d1; casing-only carry)
    entry: python scripts/validate_audit_casing.py
    language: system
    always_run: true
    pass_filenames: false
  # validate-backlog: ADR-66 story-map structural gate (content-parity D1). Carried as the
  # ADR-78 floor twin of the hub validator (plugins/tier1-lifecycle/scripts/validate_backlog.py)
  # -- NO automated carrier yet (intake G1/G2), so re-sync scripts/validate_backlog.py by hand
  # on hub changes. Floor twin deliberately omits [S<n>] story-id enforcement (Wave-1 doctrine).
  - id: validate-backlog
    name: Validate BACKLOG.md story-map (ADR-66)
    entry: python scripts/validate_backlog.py
    language: system
    files: '^BACKLOG\.md$'
    pass_filenames: false
- repo: https://github.com/rdwornik/dev-knowledge
  rev: v1.3.1
  hooks:
  - id: toc-freshness
    files: ^protocols/COUNCIL_QUESTION_GUIDE\.md$
  - id: toc-generate
    files: ^protocols/COUNCIL_QUESTION_GUIDE\.md$
  - id: backlog-id-on-close
  # codemap-freshness intentionally NOT consumed -- ai-council's codemap is hand-authored
  # (ARCHITECTURE.md Codemap; flat single-package, no tach.toml) so `codemap check` always
  # diffs. Same exclusion as corp-monorepo; recorded in .methodology.yaml. (hub-codemap-hooks
  # is waivable:true)
  - id: block-ff-push
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.5
  hooks:
  # Bare id (no name:) is DELIBERATE prune-safety -- matches corp-monorepo's shape so a
  # future hub remove-leg targeting the canonical-named stanza cannot silently delete this
  # consumer-owned gate. See .methodology.yaml (consumer-ruff-gate waiver). Re-activated by
  # fleet ruling 2026-07-12 (overriding the [#244] prune). Gate mode: `ruff check` (no --fix).
  - id: ruff
    args: []
