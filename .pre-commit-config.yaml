default_stages:
- pre-commit
repos:
- repo: local
  hooks:
  - id: normalize-headers
    name: Normalize dated-log entry headers
    language: python
    entry: python scripts/normalize_headers.py
    files: ^(LESSONS|JOURNAL)\.md$
    pass_filenames: true
  - id: floor-hash-verify
    name: Verify CLAUDE-FLOOR.md matches its sha256 sidecar
    entry: python .claude/check_floor_hash.py
    language: system
    files: ^\.claude/CLAUDE-FLOOR\.md(\.sha256)?$
    pass_filenames: false
- repo: ../.dev-knowledge
  rev: v1.0.0
  hooks:
  - id: toc-freshness
    files: ^docs/council-question-guide\.md$
  - id: toc-generate
    files: ^docs/council-question-guide\.md$
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.5
  hooks:
  - id: ruff
    name: Ruff lint gate (Tier-1, pinned rev; blocks on violations)
    args: []
