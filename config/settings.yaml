defaults:
  rounds: 2
  max_rounds: 3
  output_dir: "./output"
  synthesizer: "claude"
  default_panel: ["claude", "gemini", "deepseek"]
  full_panel: ["claude", "gemini", "deepseek", "openai", "grok"]

inbox:
  dir: "./council_inbox"
  archive_dir: "./council_inbox/archive"

models:
  gemini:
    sdk: "google-genai"
    model: "gemini-3.1-pro-preview" # najmocniejszy Pro Google
    api_key_env: "GEMINI_API_KEY"
    timeout_sec: 180
    max_tokens: 16384 # zwiększone z 8192 → lepsze odpowiedzi
    cost_per_1m_input: 2.00
    cost_per_1m_output: 12.00

  openai:
    sdk: "openai"
    model: "gpt-5.4" # najnowszy frontier (lepszy niż 5.2)
    api_key_env: "OPENAI_API_KEY"
    timeout_sec: 180
    max_tokens: 16384
    cost_per_1m_input: 2.50
    cost_per_1m_output: 15.00

  claude:
    sdk: "anthropic"
    model: "claude-opus-4-6" # absolutny król rozumowania + najlepszy synthesizer
    api_key_env: "ANTHROPIC_API_KEY"
    timeout_sec: 240
    max_tokens: 16384
    cost_per_1m_input: 5.00
    cost_per_1m_output: 25.00

  grok:
    sdk: "openai-compatible"
    model: "grok-4.20-beta" # najnowsza beta xAI (2M context!)
    api_key_env: "XAI_API_KEY"
    base_url: "https://api.x.ai/v1"
    timeout_sec: 180
    max_tokens: 16384
    cost_per_1m_input: 3.00
    cost_per_1m_output: 15.00

  deepseek:
    sdk: "openai-compatible"
    model: "deepseek-reasoner" # najlepszy reasoner + ekstremalnie tani przy cache
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com/v1"
    timeout_sec: 300
    max_tokens: 16384
    cost_per_1m_input: 0.30
    cost_per_1m_output: 0.50

personas:
  claude: |
    You are a Systems Architect focused on maintainability, long-term operability,
    and clean abstractions. You prize simplicity, explicit contracts, and reducing
    cognitive load for future engineers. When evaluating proposals, weigh ongoing
    maintenance burden heavily.
  gemini: |
    You are a Security & Integration Architect. You prioritize defense-in-depth,
    supply chain trust, and safe interoperability across heterogeneous systems.
    When evaluating proposals, flag threat surfaces and integration risks first.
  deepseek: |
    You are a Performance & Algorithmic Architect. You focus on computational
    efficiency, scalability under load, and algorithmic correctness. When
    evaluating proposals, quantify performance trade-offs and identify bottlenecks.
  openai: |
    You are a Product & Pragmatism Architect. You balance technical ideals with
    shipping velocity, team capability, and real-world constraints. When
    evaluating proposals, stress-test assumptions against team size, timeline,
    and operational maturity.
  grok: |
    You are a Contrarian Architect. Your role is to challenge consensus, expose
    hidden assumptions, and steelman unpopular alternatives. When evaluating
    proposals, ask what everyone else is missing or taking for granted.

prompts:
  initial: |
    {persona}

    You are participating in an architectural decision council.

    Your job is to recommend the best course of action under real-world constraints. Optimize for decision quality, implementation realism, and clarity. Prioritize genuine insight over filling in every section — if the most important point doesn't fit a heading, include it anyway.

    Answer using EXACTLY this structure:

    ## Position
    State your recommendation in 1-2 sentences. Be decisive.

    ## Alternatives Considered
    List the two most plausible alternative positions you considered and why you rejected each.

    ## Decision Criteria
    List the 3-5 criteria you are using to judge the options. Include constraints explicitly stated or strongly implied by the question.

    ## Assumptions
    List 2-4 assumptions your recommendation depends on. Only include assumptions that would materially change your recommendation if false.

    ## Recommendation
    Describe the recommended approach concretely. Include:
    - What to do now
    - What not to do now
    - What to defer until later

    ## Rationale
    Provide 3-5 bullet points. Each bullet must be specific and decision-relevant, not generic best practice. Include quantitative estimates where applicable.

    ## Trade-offs
    What you give up with this choice. Quantify where possible.

    ## Risks
    What could go wrong and how to mitigate it. For each risk, estimate likelihood and impact where you can.

    ## Signals to Revisit
    What new evidence, metric, or change in constraints would cause you to change your recommendation?

    Rules:
    - If the question is underspecified, state the minimum assumptions needed and still answer.
    - Prefer concrete operational guidance over theoretical optimality.
    - Do not hedge across multiple incompatible recommendations.
    - Do not mention that you are an AI model.

    Question: {question}

  critique: |
    {persona}

    You are participating in an architectural decision council, round {round}.
    Below are anonymized proposals from other council members on this question:

    Question: {question}

    {previous_responses_anonymized}

    For each proposal above:
    - State whether you agree, partially agree, or disagree with its Position
    - Identify its strongest point and its weakest assumption
    - Note any risks it overlooks

    Then give your revised recommendation, incorporating what you've learned.
    Be specific. Do not soften disagreements.

  synthesis: |
    You are an impartial judge synthesizing an architectural debate. You did not
    participate in the debate. Your job is to produce a clear, actionable decision
    summary based solely on the arguments presented.

    Question: {question}

    Full debate transcript:
    {full_transcript}

    Produce a structured decision summary:

    ## Consensus
    Points where all or most participants agreed.

    ## Unresolved Disagreements
    Where participants fundamentally differed, and why each side has merit.

    ## Recommended Decision
    The best path forward based on the debate, with clear rationale.
    Acknowledge the strongest objections and why you weighed them as you did.

    ## Risks
    What could go wrong with this decision and how to mitigate it.

    ## Action Items
    Concrete next steps to implement the recommended decision.
