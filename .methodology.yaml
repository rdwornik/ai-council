# Consumer conformance metadata read by the hub Informant
# (.dev-knowledge scripts/enforcement_coverage.py, [#244] P4 / D2).
# Each entry: component id + MANDATORY reason + time-box (expiry or review_date).
sanctioned_divergences:
  - component: ruff-gate
    reason: >-
      ai-council runs its OWN consumer-owned ruff gate (astral-sh/ruff-pre-commit
      mirror pinned v0.15.5, gate mode `args: []` = check-only no --fix; lint config
      E/F/I/W in pyproject.toml). The fleet-generic managed hook set carries NO ruff
      ([#244] dropped it from the manifest), so ANY consumer running a ruff gate is
      divergent-by-definition and must declare it here. Re-activated by fleet ruling
      2026-07-12, overriding this repo's own [#244] prune (2026-07-04, deploy 31e785d).
      PRUNE-SAFE SHAPE: the stanza uses a bare `id: ruff` (no `name:`) so a future hub
      remove-leg targeting the canonical-named tombstone shape cannot silently delete
      this consumer-owned gate -- identical prune-safety rationale to corp-monorepo's
      ruff-gate entry. Durable per-consumer prune scoping is hub #276.
    review_date: 2026-10-12

  - component: hub-codemap-hooks
    reason: >-
      ai-council does NOT consume the codemap-freshness hub hook. Its codemap is
      hand-authored (ARCHITECTURE.md Codemap block, ADR-51): ai-council is a flat
      single-package layout (src/ai_council/) with no tach.toml, so the hub codemap
      generator degenerates to a 2-orphan stub (#262) and `codemap check` ALWAYS
      reports a diff -- adding it as an active pre-commit gate would block every
      commit touching src/*.py / ARCHITECTURE.md / pyproject.toml. Identical
      exclusion to corp-monorepo (also hand-authored, single-package). hub-codemap-hooks
      is waivable:true in manifest-v1.3.x. NOTE: the deploy tool does not yet read this
      waiver (hub #276 design-deferred) -- a real `deploy/tool.py --execute` would
      re-append codemap-freshness on a rev bump; re-remove until #276 lands.
    review_date: 2026-10-11

  # --- fleet ruling d1: ADR-101 R4 casing gate is carried CASING-ONLY -----------------
  # ai-council carries only the R4 casing branch of the hub gate
  # (.dev-knowledge/scripts/validate_hermetization.py) as the local hook
  # scripts/validate_audit_casing.py. The two hub-local branches below are NOT carried;
  # they are recorded here so the full divergence surface stays machine-readable for the
  # hub Informant / A1 fleet_parity checker. Neither component is a v1.3.1 consumer-manifest
  # id (the full gate is HUB-ONLY), so both are inert-but-recorded divergence-surface entries.
  - component: hub-hermetization-rule-a
    reason: >-
      Hub Rule A (ADR-101 top-level tree seal) is HUB-LOCAL and deliberately NOT carried.
      It is keyed to the HUB tree (its SANCTIONED_TIER1_DIRS omit `src/`), so carrying it
      verbatim into ai-council would BLOCK every new file added under `src/ai_council/` --
      it would brick normal development. ai-council carries only the R4 casing branch
      (scripts/validate_audit_casing.py). Authority: hub ADR-101 R4 / fleet ruling d1.
    review_date: 2026-10-12
  - component: hub-hermetization-rule-b-grammar
    reason: >-
      Hub Rule B's date-shape grammar + the CLOSED 11-class audit-class enum are HUB-LOCAL
      and deliberately NOT carried. ai-council audits use free-form leading tokens
      (code-quality, fable-*, council-*, research-*, fleet-recon, methodology-adoption):
      already casing-conformant, not enum-conformant. This repo enforces the R4 casing
      branch ONLY (scripts/validate_audit_casing.py). The enum and date-shape grammar remain
      hub-local per fleet ruling d1; any future carry of the full gate requires a new operator
      ruling. Authority: hub ADR-101 R4 / fleet ruling d1.
    review_date: 2026-10-12
